[workspace]

[package]
name = "rust-100-exercises"
version = "0.1.0"
edition = "2021"
description = "Rust 100 练习题 - 独立单文件版本，含中文注释"

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }

[features]
default = []
ch08 = ["tokio", "anyhow"]

