[package]
name = "projects"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }

[[bin]]
name = "projects"
path = "src/main.rs"

[[bin]]
name = "reqwest_test"
path = "src/reqwest_test.rs"
