[package]
name = "learning_notes"
version = "0.1.0"
edition = "2021"

[features]
# 演示用的虚构 feature，让 cargo_features.rs 里的 cfg 示例可以合法编译
logging = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

