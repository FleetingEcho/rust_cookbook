[package]
name = "cookbook-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "seed"
path = "bin/seed.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
sqlx        = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
anyhow      = "1"
regex       = "1"
walkdir     = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy     = "0.15"
